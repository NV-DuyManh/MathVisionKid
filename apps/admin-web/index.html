    <script>
      if (location.pathname === '/auth/continue' || location.pathname === '/login') {
        const code = new URLSearchParams(location.hash.slice(1)).get('sso');
        if (code) {
          window.mathVisionSsoTicket = code;
          history.replaceState(history.state, '', '/auth/continue');
        }
      }
    </script>
