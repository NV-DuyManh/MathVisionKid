openapi: 3.1.0
info:
  title: MathVision Kids API
  description: Canonical API for MathVision Kids Student and Teacher applications.
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: Student
  - name: Teacher
  - name: Auth
  - name: Admin
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login for Teachers (and potentially students later)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current user and invalidate refresh token
      responses:
        '200':
          description: Successfully logged out

  /me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /student/submissions:
    post:
      tags:
        - Student
      summary: Upload a new math submission image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                source:
                  type: string
                  enum: [CAMERA, GALLERY]
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /student/submissions/{submissionId}:
    get:
      tags:
        - Student
      summary: Poll for submission status
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current submission state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /student/submissions/{submissionId}/confirm-token:
    post:
      tags:
        - Student
      summary: Confirm an ambiguous token
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTokenRequest'
      responses:
        '200':
          description: Token confirmed, status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /student/submissions/{submissionId}/retry:
    post:
      tags:
        - Student
      summary: Retry a failed or out-of-scope submission (e.g., NEEDS_RETAKE or CROP_REQUIRED)
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: The sanitized new image for retry.
                source:
                  type: string
                  description: Source of the image (e.g., CAMERA, GALLERY).
      responses:
        '202':
          description: Accepted for reprocessing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '400':
          description: Bad request, invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /teacher/dashboard:
    get:
      tags:
        - Teacher
      summary: Get teacher dashboard metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
                  recentBatches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'

  /teacher/classes:
    get:
      tags:
        - Teacher
      summary: Get all classes for the teacher
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassRoom'

  /teacher/classes/{classId}:
    get:
      tags:
        - Teacher
      summary: Get a specific class
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassRoom'

  /teacher/assignments:
    get:
      tags:
        - Teacher
      summary: Get assignments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
    post:
      tags:
        - Teacher
      summary: Create an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'

  /teacher/assignments/{assignmentId}:
    get:
      tags:
        - Teacher
      summary: Get a specific assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'

  /teacher/batches:
    post:
      tags:
        - Teacher
      summary: Create a new batch for an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignmentId:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'

    get:
      tags:
        - Teacher
      summary: Get all batches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'

  /teacher/batches/{batchId}:
    get:
      tags:
        - Teacher
      summary: Get batch status
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'

  /teacher/batches/{batchId}/submissions:
    post:
      tags:
        - Teacher
      summary: Upload multiple images to a batch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                association_metadata:
                  type: string
                  description: Optional JSON string for metadata
      responses:
        '202':
          description: Accepted for processing

  /teacher/batches/{batchId}/review:
    get:
      tags:
        - Teacher
      summary: Get items needing review in a batch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'

  /teacher/submissions/{submissionId}:
    get:
      tags:
        - Teacher
      summary: Get submission details
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /teacher/submissions/{submissionId}/approve:
    post:
      tags:
        - Teacher
      summary: Approve the AI suggested score
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptProposal:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /teacher/submissions/{submissionId}/override:
    post:
      tags:
        - Teacher
      summary: Override the AI suggested score
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: number
                reason:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /admin/users:
    get:
      tags:
        - Admin
      summary: List users with filtering and pagination
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [STUDENT, TEACHER]
        - name: active
          in: query
          schema:
            type: boolean
        - name: query
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of users
    post:
      tags:
        - Admin
      summary: Provision a new Student or Teacher user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'

  /admin/users/{userId}:
    get:
      tags:
        - Admin
      summary: Get user details and class memberships
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
    patch:
      tags:
        - Admin
      summary: Update safe profile fields of user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'

  /admin/users/{userId}/disable:
    post:
      tags:
        - Admin
      summary: Disable a user account and revoke refresh tokens
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User disabled successfully

  /admin/users/{userId}/enable:
    post:
      tags:
        - Admin
      summary: Enable a user account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User enabled successfully

  /admin/users/{userId}/reset-password:
    post:
      tags:
        - Admin
      summary: Administrative password reset
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Temporary password generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'

  /admin/classes:
    get:
      tags:
        - Admin
      summary: List classrooms with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated classrooms
    post:
      tags:
        - Admin
      summary: Create a new classroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: Class created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassResponse'

  /admin/classes/{classId}:
    get:
      tags:
        - Admin
      summary: Get classroom details and roster
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Classroom details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassResponse'
    patch:
      tags:
        - Admin
      summary: Update classroom metadata
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassRequest'
      responses:
        '200':
          description: Updated classroom
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassResponse'

  /admin/classes/{classId}/teacher:
    put:
      tags:
        - Admin
      summary: Assign active Teacher to classroom
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTeacherRequest'
      responses:
        '200':
          description: Teacher assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassResponse'

  /admin/classes/{classId}/students/{studentId}:
    post:
      tags:
        - Admin
      summary: Add active student to classroom roster
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student added to roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassResponse'
    delete:
      tags:
        - Admin
      summary: Remove student from classroom roster
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student removed from roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClassResponse'

  /admin/dashboard:
    get:
      tags:
        - Admin
      summary: Get administrative operational dashboard metrics
      responses:
        '200':
          description: Operational dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'

  /admin/audit:
    get:
      tags:
        - Admin
      summary: Get paginated administrative audit logs
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated audit event log

components:
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object

    User:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [STUDENT, TEACHER, ADMIN]

    Student:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            gradeLevel:
              type: string

    Teacher:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            title:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            schoolId:
              type: string

    ClassRoom:
      type: object
      properties:
        classId:
          type: string
        teacherId:
          type: string
        name:
          type: string
        gradeLevel:
          type: string
        studentCount:
          type: number

    Assignment:
      type: object
      properties:
        assignmentId:
          type: string
        classId:
          type: string
        title:
          type: string
        status:
          type: string

    AuditEvent:
      type: object
      properties:
        auditEventId:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        action:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    TokenRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: JWT Bearer access token
        refreshToken:
          type: string
          description: Refresh token used to rotate expired access tokens

    SubmissionStatusResponse:
      type: object
      properties:
        submissionId:
          type: string
        status:
          type: string
        createdAt:
          type: string

    ConfirmTokenRequest:
      type: object
      properties:
        tokenId:
          type: string
        confirmedValue:
          type: string

    Batch:
      type: object
      properties:
        batchId:
          type: string
        assignmentId:
          type: string
        status:
          type: string
          enum: [CREATED, UPLOADING, QUEUED, PROCESSING, COMPLETED, PARTIAL, FAILED]
        totalCount:
          type: number
        processedCount:
          type: number
        reviewRequiredCount:
          type: number

    Submission:
      type: object
      properties:
        submissionId:
          type: string
        status:
          type: string
          enum: [CREATED, IMAGE_UPLOADED, PROCESSING, NEEDS_CONFIRMATION, NEEDS_RETAKE, CROP_REQUIRED, FEEDBACK_READY, REVIEW_REQUIRED, OUT_OF_SCOPE, TEACHER_APPROVED, TEACHER_OVERRIDDEN, FAILED]
        imageUrl:
          type: string
        studentId:
          type: string
        recognizedExercise:
          type: object
        validation:
          type: object
        confidence:
          type: object
        evidence:
          type: array
          items:
            type: object
        studentFeedback:
          type: object
        gradeProposal:
          type: object
        teacherDecision:
          type: object

    CreateUserRequest:
      type: object
      required:
        - email
        - displayName
        - role
        - initialPassword
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [STUDENT, TEACHER]
        initialPassword:
          type: string
          minLength: 6
        gradeLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: Required for STUDENT (1..5), prohibited for TEACHER

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        gradeLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: Applicable only for STUDENT

    AdminUserSummary:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        gradeLevel:
          type: integer
        active:
          type: boolean

    AdminClassSummary:
      type: object
      properties:
        classId:
          type: string
        name:
          type: string
        gradeLevel:
          type: integer
        academicYear:
          type: string

    AdminUserResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        gradeLevel:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        classes:
          type: array
          items:
            $ref: '#/components/schemas/AdminClassSummary'

    ResetPasswordRequest:
      type: object
      properties:
        temporaryPassword:
          type: string
          minLength: 6

    ResetPasswordResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        temporaryPassword:
          type: string
        message:
          type: string

    CreateClassRequest:
      type: object
      required:
        - name
        - gradeLevel
        - teacherId
      properties:
        name:
          type: string
        gradeLevel:
          type: integer
          minimum: 1
          maximum: 5
        academicYear:
          type: string
        teacherId:
          type: string

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
        gradeLevel:
          type: integer
          minimum: 1
          maximum: 5
        academicYear:
          type: string

    AssignTeacherRequest:
      type: object
      required:
        - teacherId
      properties:
        teacherId:
          type: string

    AdminClassResponse:
      type: object
      properties:
        classId:
          type: string
        name:
          type: string
        gradeLevel:
          type: integer
        academicYear:
          type: string
        teacher:
          $ref: '#/components/schemas/AdminUserSummary'
        studentCount:
          type: integer
        students:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        createdAt:
          type: string
          format: date-time

    AdminDashboardResponse:
      type: object
      properties:
        totalStudents:
          type: integer
        activeStudents:
          type: integer
        disabledStudents:
          type: integer
        totalTeachers:
          type: integer
        activeTeachers:
          type: integer
        disabledTeachers:
          type: integer
        totalClasses:
          type: integer

    AdminAuditEventResponse:
      type: object
      properties:
        auditEventId:
          type: string
        eventType:
          type: string
        actorUserId:
          type: string
        actorEmail:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

