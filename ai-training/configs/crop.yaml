# Crop and Line Segmentation Configuration for MathVision Kids

preprocessing:
  deskew_enabled: true
  deskew_max_angle: 15.0
  binary_threshold_method: "otsu"   # otsu | adaptive | fixed
  blur_kernel_size: 3

segmentation:
  horizontal_merge_distance: 25
  vertical_gap_threshold: 12
  min_line_height: 18
  max_line_height: 180
  min_line_width: 60
  accent_padding_top: 8
  accent_padding_bottom: 8
  lateral_padding: 12

quality_gate:
  min_width: 40
  min_height: 16
  max_height: 250
  min_aspect_ratio: 0.8         # width / height
  min_ink_pixels: 80
  min_ink_ratio: 0.004          # foreground / total_area
  max_ink_ratio: 0.70           # reject solid black blobs or severe shadow
  blank_line_thresh: 0.995      # white pixel ratio > 0.995 -> blank
  reject_isolated_grid_lines: true
  grid_line_thickness_max: 3

output:
  debug_dir: "artifacts/crop_debug"
  crops_dir: "data/crops"
  report_path: "artifacts/reports/crop_report.json"
