version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: mathvision-postgres
    environment:
      POSTGRES_USER: mathvision
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mathvision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathvision -d mathvision"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: mathvision-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mathvision-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service:
    build:
      context: ../ai-service
    container_name: mathvision-ai-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - RUNTIME_MODE=FIXTURE
      - REDIS_URL=redis://redis:6379/0
      - SPRING_CALLBACK_BASE_URL=http://host.docker.internal:8080/internal/v1/ai/jobs
      - INTERNAL_API_KEY=secret-key-default
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-worker:
    build:
      context: ../ai-service
    container_name: mathvision-celery-worker
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "--loglevel=info"]
    environment:
      - APP_ENV=development
      - RUNTIME_MODE=FIXTURE
      - REDIS_URL=redis://redis:6379/0
      - SPRING_CALLBACK_BASE_URL=http://host.docker.internal:8080/internal/v1/ai/jobs
      - INTERNAL_API_KEY=secret-key-default
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  miniodata:
  redisdata:
