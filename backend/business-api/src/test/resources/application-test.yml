spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V30__student_profile_rewards.sql
  flyway:
    enabled: false

app:
  jwt:
    secret: test_only_signing_key_for_backend_authentication_tests_1234567890
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  storage:
    upload-root: build/test-uploads/

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123

ai:
  quiz:
    adaptive-enabled: false
  gateway:
    url: http://localhost:8000/internal/v1/jobs
  service:
    base-url: http://localhost:8000
  callback:
    api-key: test-internal-key
