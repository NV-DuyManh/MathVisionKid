spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V32__student_profile_rewards.sql
        - classpath:db/migration/V33__student_account_photos.sql
        - classpath:db/migration/V34__verified_training_runs.sql
        - classpath:db/migration/V35__leaderboard_name_privacy.sql
        - classpath:db/migration/V36__student_app_usage.sql
        - classpath:db/migration/V37__student_parent_controls.sql
        - classpath:db/migration/V38__parent_game_star_limit.sql
        - classpath:db/migration/V39__student_game_time_limit.sql
        - classpath:db/migration/V40__parent_pin_email_recovery.sql
        - classpath:db/migration/V41__student_achievement_path.sql
        - classpath:db/migration/V42__student_google_avatar.sql
        - classpath:db/migration/V44__leaderboard_avatar_consent.sql
  flyway:
    enabled: false

app:
  jwt:
    secret: test_only_signing_key_for_backend_authentication_tests_1234567890
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  storage:
    upload-root: build/test-uploads/

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123

ai:
  quiz:
    adaptive-enabled: false
  gateway:
    url: http://localhost:8000/internal/v1/jobs
  service:
    base-url: http://localhost:8000
  callback:
    api-key: test-internal-key
