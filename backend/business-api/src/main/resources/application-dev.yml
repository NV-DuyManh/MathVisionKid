spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathvision}
    username: ${DB_USERNAME:mathvision}
    password: ${DB_PASSWORD:password123}

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_development_jwt_key_do_not_use_in_production_1234567890}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:8081,http://127.0.0.1:3000,http://127.0.0.1:5172,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8081}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}

ai:
  gateway:
    url: ${AI_SERVICE_URL:http://localhost:8000/internal/v1/jobs}
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  callback:
    api-key: ${INTERNAL_API_KEY:secret-key-default}

# The local launcher verifies this checkout using diskSpace.details.path.
# Production inherits the hidden health response from application.yml.
management:
  endpoint:
    health:
      show-details: always
      show-components: always
