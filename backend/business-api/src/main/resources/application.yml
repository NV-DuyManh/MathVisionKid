spring:
  application:
    name: mathvision-business-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  storage:
    upload-root: ${UPLOAD_ROOT:.data/uploads/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ocr:
    pilot:
      collection-mode: ${OCR_PILOT_COLLECTION_MODE:TEST}

minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:mathvision}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

ai:
  gateway:
    mode: ${AI_GATEWAY_MODE:FASTAPI}
    url: ${AI_SERVICE_URL:}
  service:
    base-url: ${AI_SERVICE_BASE_URL:}
  callback:
    api-key: ${INTERNAL_API_KEY:}
