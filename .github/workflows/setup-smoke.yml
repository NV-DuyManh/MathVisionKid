name: Fresh Windows dependency setup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setup-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the actual installer in a fresh checkout (no dependency cache)
        shell: powershell
        run: |
          ./scripts/dev/setup-local.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify libraries and Student types after installation
        shell: powershell
        run: |
          ./ai/runtime/.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck --workspace=student-mobile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer diagnostics on failure (no .env or private data)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fresh-windows-setup-${{ github.run_id }}
          path: backend/business-api/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore
