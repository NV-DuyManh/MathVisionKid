name: Lesson catalog guard
on:
  pull_request:
    paths:
      - 'ai/runtime/app/tutoring/**'
      - 'ai/runtime/scripts/*catalog*'
      - 'ai/runtime/tests/fixtures/student_learning_regression.json'
      - '.github/workflows/lesson-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ai/runtime/app/tutoring/**'
      - 'ai/runtime/scripts/*catalog*'
      - 'ai/runtime/tests/fixtures/student_learning_regression.json'
      - '.github/workflows/lesson-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify durable storage isolation and integrity
        run: python ai/runtime/scripts/test_catalog_store.py -v
      - name: Audit curated regression inventory
        run: python ai/runtime/scripts/catalog_audit.py --corpus ai/runtime/tests/fixtures/student_learning_regression.json --summary
