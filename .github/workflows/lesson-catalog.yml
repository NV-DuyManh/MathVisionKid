name: MathVision Catalog Bot
on:
  pull_request:
    paths:
      - 'ai/runtime/app/tutoring/**'
      - 'ai/runtime/scripts/*catalog*'
      - 'ai/runtime/tests/fixtures/student_learning_regression.json'
      - '.github/workflows/lesson-catalog.yml'
      - 'catalog/**'
      - 'RUN_CATALOG_BOT.bat'
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    paths:
      - 'ai/runtime/app/tutoring/**'
      - 'ai/runtime/scripts/*catalog*'
      - 'ai/runtime/tests/fixtures/student_learning_regression.json'
      - '.github/workflows/lesson-catalog.yml'
      - 'catalog/**'
      - 'RUN_CATALOG_BOT.bat'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Catalog · lưu trữ và dùng lại
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify durable storage isolation and integrity
        run: python ai/runtime/scripts/test_catalog_store.py -v
      - name: Verify bot privacy and failure reporting
        id: bot-tests
        run: python ai/runtime/scripts/test_catalog_bot.py -v
      - name: Build visible catalog report
        if: ${{ !cancelled() }}
        env:
          CATALOG_BOT_TEST_STATUS: ${{ steps.bot-tests.outcome }}
        run: python ai/runtime/scripts/catalog_bot.py --output catalog-bot-report
      - name: Keep catalog report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mathvision-catalog-bot
          path: |
            catalog-bot-report/index.html
            catalog-bot-report/status.json
            catalog-bot-report/summary.md
          if-no-files-found: error
          retention-days: 14
