version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      patch-and-minor:
        update-types: [minor, patch]
        exclude-patterns: ['expo*', '@expo/*', 'react', 'react-dom', 'react-native*', '@react-native/*']
  - package-ecosystem: gradle
    directory: /backend/business-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: pip
    directory: /ai/runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    # ML versions move together in a measured, owner-approved runtime update.
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: ultralytics
      - dependency-name: opencv-python
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
