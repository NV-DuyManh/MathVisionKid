# Applied after compose.yml; keep every host port private to this PC.
name: mathvision-pc-preview
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: [tunnel, --no-autoupdate, --protocol, http2, --edge-ip-version, "4", --url, "http://gateway:8080"]
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gateway:
    ports: !override
      - "127.0.0.1:18081:8080"
    volumes: !override
      - ./Caddyfile.pc-preview:/etc/caddy/Caddyfile:ro
